<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="100%" height="100%">
  <defs>
    <!-- Soft Ivory / Archival Paper Gradient -->
    <linearGradient id="paper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF9F6" />
      <stop offset="60%" stop-color="#F3EFEA" />
      <stop offset="100%" stop-color="#E8E3DC" />
    </linearGradient>

    <!-- Asymmetrical Ink & Watercolour Smudges -->
    <radialGradient id="ink-cloud-1" cx="32%" cy="48%" r="32%">
      <stop offset="0%" stop-color="#2C302E" stop-opacity="0.12" />
      <stop offset="50%" stop-color="#6E7A85" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#FAF9F6" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="ochre-burst" cx="48%" cy="42%" r="38%">
      <stop offset="0%" stop-color="#B59B7C" stop-opacity="0.22" />
      <stop offset="55%" stop-color="#9E7B66" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#FAF9F6" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="slate-drift" cx="68%" cy="50%" r="35%">
      <stop offset="0%" stop-color="#6E7A85" stop-opacity="0.18" />
      <stop offset="65%" stop-color="#8FA0AE" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#FAF9F6" stop-opacity="0" />
    </radialGradient>

    <!-- Smooth Fade-In / Fade-Out Mask for the Propagating Spike Train -->
    <linearGradient id="spike-fade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="12%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="88%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <mask id="spike-window">
      <rect x="410" y="25" width="470" height="190" fill="url(#spike-fade)" />
    </mask>
  </defs>

  <!-- Background -->
  <rect width="900" height="300" rx="8" fill="url(#paper)" />

